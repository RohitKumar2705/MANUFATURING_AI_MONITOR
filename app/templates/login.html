<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login - NovaTech</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <div style="font-weight:700;font-size:16px;margin-bottom:2px;">NovaTech Manufacturing</div>
    <div style="color:var(--text-dim);font-size:12px;margin-bottom:20px;">Admin Login</div>
    <div class="form-row"><label>Username</label><input id="username" value="admin"></div>
    <div class="form-row"><label>Password</label><input id="password" type="password" placeholder="novatech123"></div>
    <button class="btn primary" style="width:100%;" onclick="login()">Log In</button>
    <div id="err" style="color:var(--red);font-size:12px;margin-top:10px;"></div>
    <div style="color:var(--text-dim);font-size:11px;margin-top:14px;">
      Demo credentials: admin / novatech123
    </div>
    <a href="/" style="display:block;text-align:center;margin-top:14px;font-size:12px;color:var(--accent);">← Back to Dashboard</a>
  </div>
</div>
<script>
async function login() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const r = await fetch('/api/dashboard/login', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({username, password})
  });
  if (r.ok) { location.href = '/settings'; }
  else { document.getElementById('err').textContent = 'Invalid username or password'; }
}
</script>
</body>
</html>
